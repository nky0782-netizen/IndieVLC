name: Unpack IndieVLC project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          archive="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$archive" -d unpacked

          project_dir="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$project_dir" ]; then
            echo "Project folder not found"
            exit 1
          fi

          cp -a "$project_dir"/. .
          rm -rf unpacked
          rm -f ./*.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract IndieVLC Android project" || echo "No changes"
          git push

name: Build IndieVLC APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

          # Force Java and Kotlin compiler targets to match (Java 17)
          ./gradlew :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            -Pkotlin.compiler.jvmTarget=17 \
            -Pandroid.compileOptions.sourceCompatibility=VERSION_17 \
            -Pandroid.compileOptions.targetCompatibility=VERSION_17 \
            --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IndieVLC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          

name: Build IndieVLC APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Align JVM targets and Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 1. Ensure Gradle 8.9 wrapper is generated
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

          # 2. Patch JavaVersion.VERSION_1_8 to VERSION_17 in app/build.gradle.kts
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "8"/jvmTarget = "17"/g' app/build.gradle.kts

          # 3. Compile the debug APK
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IndieVLC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          

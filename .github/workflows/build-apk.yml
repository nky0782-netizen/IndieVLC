name: Build IndieVLC APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate project and ensure Gradle wrapper
        run: |
          # Look for gradlew or build.gradle(.kts)
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle found in repository!"
            find . -maxdepth 2
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # If gradlew does not exist, generate it
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing; installing gradle wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IndieVLC-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
          

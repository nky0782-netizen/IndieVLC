name: Build IndieVLC APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate project and build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle file found in repository"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Use gradlew if present, otherwise build using installed gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IndieVLC-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          

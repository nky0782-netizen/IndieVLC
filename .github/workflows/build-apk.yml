name: Build IndieVLC APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate project and build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle file found in repository"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IndieVLC-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
